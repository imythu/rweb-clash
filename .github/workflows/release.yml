name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Stable SemVer without a leading v (for example, 1.0.0)"
        required: true
      mihomo_version:
        description: "Mihomo release tag, or latest"
        default: "latest"
        required: true
      sign_desktop:
        description: "Sign and notarize desktop packages using configured secrets"
        type: boolean
        default: false
        required: true
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      display_version: ${{ steps.version.outputs.display_version }}
      macos_bundle_version: ${{ steps.version.outputs.macos_bundle_version }}
      mihomo_version: ${{ steps.mihomo.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      windows_bundle_version: ${{ steps.version.outputs.windows_bundle_version }}
    steps:
      - name: Generate Beijing-time version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_RELEASE_VERSION: ${{ github.event.inputs.release_version || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GIT_REF" != "refs/heads/master" ]; then
            echo "Stable releases must be dispatched from master; got $GIT_REF" >&2
            exit 1
          fi
          IFS='|' read -r compact year year_short month day clock display \
            <<< "$(TZ=Asia/Shanghai date '+%Y%m%d-%H%M|%Y|%y|%-m|%-d|%H%M|%Y-%m-%d %H:%M CST')"
          if [ "$GIT_REF_TYPE" = "tag" ]; then
            release_version="${GIT_REF_NAME#v}"
            if [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
              channel="beta"
            else
              channel="stable"
            fi
            release_tag="$GIT_REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_version="${REQUESTED_RELEASE_VERSION#v}"
            channel="stable"
            release_tag="v$release_version"
          else
            channel="snapshot"
            release_tag="snapshot-$compact"
          fi
          if [ "$channel" = "stable" ] &&
             [[ ! "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable release version must be numeric SemVer (for example, 1.0.0): $release_version" >&2
            exit 1
          fi
          if [ "$channel" = "beta" ] &&
             [[ ! "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            echo "Beta release version must use SemVer beta.N (for example, 1.0.0-beta.1): $release_version" >&2
            exit 1
          fi
          month_day="$((10#$month * 100 + 10#$day))"
          clock_number="$((10#$clock))"
          if [ "$channel" != "snapshot" ]; then
            package_version="$release_version"
          else
            package_version="$((10#$year)).$month_day.$clock_number"
          fi
          macos_bundle_version="${compact/-/}"
          windows_bundle_version="$((10#$year_short)).$month.$day.$clock_number"
          {
            echo "channel=$channel"
            echo "display_version=$display"
            echo "macos_bundle_version=$macos_bundle_version"
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
            echo "windows_bundle_version=$windows_bundle_version"
          } >> "$GITHUB_OUTPUT"
          printf 'channel=%s\nrelease_tag=%s\npackage_version=%s\nmacos_bundle_version=%s\nwindows_bundle_version=%s\n' \
            "$channel" "$release_tag" "$package_version" "$macos_bundle_version" "$windows_bundle_version"
      - name: Reject an existing generated release tag
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          case "$status" in
            404) ;;
            200)
              echo "Release tag already exists: $RELEASE_TAG." >&2
              exit 1
              ;;
            *)
              echo "Unable to check release tag $RELEASE_TAG (HTTP $status)." >&2
              exit 1
              ;;
          esac
      - name: Resolve Mihomo release tag
        id: mihomo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ github.event.inputs.mihomo_version || 'latest' }}
        run: |
          version="$REQUESTED_VERSION"
          if [ "$version" = "latest" ]; then
            version="$(curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid Mihomo release tag: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved Mihomo release: $version"

  runtime-assets:
    name: Prepare shared runtime assets
    runs-on: ubuntu-24.04
    needs: metadata
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download verified rules and GeoIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/package-rule-sets.sh
          bash scripts/package-runtime-assets.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-runtime-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            packaging/cache/rule-sets
            packaging/cache/runtime

  linux-binaries:
    name: Linux ${{ matrix.name }} binary
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - runtime-assets
    env:
      MIHOMO_VERSION: ${{ needs.metadata.outputs.mihomo_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            package_target: linux-amd64
            rust_target: x86_64-unknown-linux-musl
            artifact: rweb-clash-linux-amd64
          - name: arm64
            package_target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            artifact: rweb-clash-linux-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-runtime-assets
          path: packaging/cache
      - name: Sync package version
        shell: pwsh
        env:
          MACOS_BUNDLE_VERSION: ${{ needs.metadata.outputs.macos_bundle_version }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          WINDOWS_BUNDLE_VERSION: ${{ needs.metadata.outputs.windows_bundle_version }}
        run: pwsh -NoProfile -File scripts/sync-release-version.ps1 -Version $env:PACKAGE_VERSION -MacosBundleVersion $env:MACOS_BUNDLE_VERSION -WindowsBundleVersion $env:WINDOWS_BUNDLE_VERSION
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Install static cross builder and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-binfmt
          cargo install cross --version 0.2.5 --locked
      - name: Verify arm64 binfmt handler
        if: matrix.name == 'arm64'
        run: test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check packaging scripts
        run: bash -n scripts/package-core.sh scripts/package-rule-sets.sh scripts/package-runtime-assets.sh scripts/package-local.sh scripts/prepare-tauri-resources.sh scripts/verify-tauri-resources.sh scripts/release-smoke.sh scripts/configure-macos-signing.sh scripts/verify-docker-manifest.sh scripts/verify-linux-archive.sh packaging/linux/install.sh packaging/linux/install-systemd.sh
      - name: Check PowerShell packaging scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/package-core.ps1",
            "scripts/package-rule-sets.ps1",
            "scripts/package-runtime-assets.ps1",
            "scripts/package-local.ps1",
            "scripts/prepare-tauri-resources.ps1",
            "scripts/verify-tauri-resources.ps1",
            "scripts/release-smoke.ps1",
            "scripts/verify-release-local.ps1",
            "scripts/verify-release-workflow.ps1",
            "scripts/configure-tauri-signing.ps1",
            "scripts/sync-release-version.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              throw "PowerShell syntax check failed for $script"
            }
          }
      - name: Check release workflow structure
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release-workflow.ps1
      - name: Prepare embedded assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/package-core.sh --target "${{ matrix.package_target }}" --version "$MIHOMO_VERSION"
          pnpm --dir web build
      - name: Build binary
        run: cross build -p rweb-clash-bin --features embedded-assets --release --locked --target "${{ matrix.rust_target }}"
      - name: Verify statically linked binary
        run: |
          file target/${{ matrix.rust_target }}/release/rweb-clash-bin
          if readelf -l target/${{ matrix.rust_target }}/release/rweb-clash-bin | grep -Fq 'Requesting program interpreter'; then
            echo "Linux release binary is dynamically linked" >&2
            exit 1
          fi
          if readelf -d target/${{ matrix.rust_target }}/release/rweb-clash-bin 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "Linux release binary has dynamic library dependencies" >&2
            exit 1
          fi
      - name: Smoke test Linux amd64 binary
        if: matrix.name == 'amd64'
        run: bash scripts/release-smoke.sh --verify-embedded-assets --binary target/${{ matrix.rust_target }}/release/rweb-clash-bin --listen 127.0.0.1:32990
      - name: Smoke test Linux arm64 binary with QEMU
        if: matrix.name == 'arm64'
        run: bash scripts/release-smoke.sh --verify-embedded-assets --runner "qemu-aarch64" --binary target/${{ matrix.rust_target }}/release/rweb-clash-bin --listen 127.0.0.1:32990
      - name: Package binary
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.rust_target }}/release/rweb-clash-bin dist/${{ matrix.artifact }}/rweb-clash
          cp target/${{ matrix.rust_target }}/release/rweb-clash-bin dist/${{ matrix.artifact }}.bin
          cp README.md dist/${{ matrix.artifact }}/README.md
          cp LICENSE dist/${{ matrix.artifact }}/LICENSE
          cp packaging/linux/README.md dist/${{ matrix.artifact }}/LINUX.md
          cp packaging/linux/install.sh packaging/linux/install-systemd.sh packaging/linux/rweb-clash.service packaging/linux/rweb-clash-system.service packaging/linux/rweb-clash-ready.service packaging/linux/rweb-clash.env scripts/release-smoke.sh scripts/release-smoke.ps1 dist/${{ matrix.artifact }}/
          chmod +x dist/${{ matrix.artifact }}/rweb-clash dist/${{ matrix.artifact }}.bin dist/${{ matrix.artifact }}/install.sh dist/${{ matrix.artifact }}/install-systemd.sh dist/${{ matrix.artifact }}/release-smoke.sh
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          (cd dist && sha256sum ${{ matrix.artifact }}.bin > ${{ matrix.artifact }}.bin.sha256)
          (cd dist && sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256)
      - name: Verify Linux archive contents
        run: bash scripts/verify-linux-archive.sh --archive dist/${{ matrix.artifact }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
            dist/${{ matrix.artifact }}.bin
            dist/${{ matrix.artifact }}.bin.sha256

  docker:
    name: Linux Docker image
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - linux-binaries
      - runtime-assets
    env:
      MIHOMO_VERSION: ${{ needs.metadata.outputs.mihomo_version }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-runtime-assets
          path: packaging/cache
      - name: Sync package version
        shell: pwsh
        env:
          MACOS_BUNDLE_VERSION: ${{ needs.metadata.outputs.macos_bundle_version }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          WINDOWS_BUNDLE_VERSION: ${{ needs.metadata.outputs.windows_bundle_version }}
        run: pwsh -NoProfile -File scripts/sync-release-version.ps1 -Version $env:PACKAGE_VERSION -MacosBundleVersion $env:MACOS_BUNDLE_VERSION -WindowsBundleVersion $env:WINDOWS_BUNDLE_VERSION
      - name: Set GHCR image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.release_tag }}
            type=raw,value=snapshot,enable=${{ needs.metadata.outputs.channel == 'snapshot' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.channel == 'stable' }}
            type=sha
      - name: Build Docker image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            MIHOMO_VERSION=${{ env.MIHOMO_VERSION }}
            USE_PREPARED_RUNTIME_ASSETS=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: rweb-clash:smoke
      - name: Smoke test Docker image
        run: |
          token="release-smoke-token-0123456789abcdef"
          docker run -d --name rweb-clash-smoke --network none -e RWEB_CLASH_API_TOKEN="$token" rweb-clash:smoke
          trap 'docker logs rweb-clash-smoke || true; docker rm -f rweb-clash-smoke || true' EXIT
          for i in $(seq 1 40); do
            if docker exec rweb-clash-smoke curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:31990/api/setup/status >/dev/null; then
              docker exec rweb-clash-smoke curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:31990/api/diagnostics/export | grep -q '^# rweb-clash diagnostics'
              docker exec rweb-clash-smoke test -x /var/lib/rweb-clash/cache-core/mihomo
              docker exec rweb-clash-smoke test -s /var/lib/rweb-clash/data/profiles/geoip.metadb
              rule_count="$(docker exec rweb-clash-smoke sh -c 'find /var/lib/rweb-clash/data/profiles/rule-sets -maxdepth 1 -type f -name "*.list" | wc -l')"
              test "$rule_count" -eq 13
              core_status="$(docker exec rweb-clash-smoke curl -fsS -X POST -H "Authorization: Bearer $token" http://127.0.0.1:31990/api/core/start)"
              printf '%s' "$core_status" | grep -q '"state":"running"'
              docker exec rweb-clash-smoke curl -fsS -X POST -H "Authorization: Bearer $token" http://127.0.0.1:31990/api/core/stop >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Docker image did not become ready." >&2
          exit 1
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MIHOMO_VERSION=${{ env.MIHOMO_VERSION }}
            USE_PREPARED_RUNTIME_ASSETS=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify Docker multiarch manifest
        shell: bash
        run: |
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          bash scripts/verify-docker-manifest.sh --image "$image"

  tauri:
    name: Tauri ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs:
      - metadata
      - runtime-assets
    env:
      MIHOMO_VERSION: ${{ needs.metadata.outputs.mihomo_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            package_target: macos-arm64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.macos.conf.json --ci
          - name: windows-amd64
            os: windows-2025
            package_target: windows-amd64
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles msi,nsis --config src-tauri/tauri.windows.conf.json --ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-runtime-assets
          path: packaging/cache
      - name: Sync package version
        shell: pwsh
        env:
          MACOS_BUNDLE_VERSION: ${{ needs.metadata.outputs.macos_bundle_version }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          WINDOWS_BUNDLE_VERSION: ${{ needs.metadata.outputs.windows_bundle_version }}
        run: pwsh -NoProfile -File scripts/sync-release-version.ps1 -Version $env:PACKAGE_VERSION -MacosBundleVersion $env:MACOS_BUNDLE_VERSION -WindowsBundleVersion $env:WINDOWS_BUNDLE_VERSION
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Check signed release secrets on macOS
        if: github.event_name == 'workflow_dispatch' && inputs.sign_desktop && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "missing required macOS release secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: Check signed release secrets on Windows
        if: github.event_name == 'workflow_dispatch' && inputs.sign_desktop && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_CERTIFICATE_TIMESTAMP_URL: ${{ vars.WINDOWS_CERTIFICATE_TIMESTAMP_URL }}
        run: |
          $missing = @()
          foreach ($name in @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_CERTIFICATE_TIMESTAMP_URL")) {
            if (-not (Get-Item "Env:\$name" -ErrorAction SilentlyContinue).Value) {
              $missing += $name
            }
          }
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            Write-Host "WINDOWS_CERTIFICATE_THUMBPRINT is not set; it will be inferred from WINDOWS_CERTIFICATE."
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Error "missing required Windows release secret or variable: $_" }
            throw "Missing Windows signing configuration."
          }
      - name: Install workspace dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Ensure macOS packaging dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: command -v jq >/dev/null 2>&1 || brew install jq
      - name: Prepare Tauri resources on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/package-core.sh --target "${{ matrix.package_target }}" --version "$MIHOMO_VERSION"
          bash scripts/prepare-tauri-resources.sh --target "${{ matrix.package_target }}"
          bash scripts/verify-tauri-resources.sh --target "${{ matrix.package_target }}"
      - name: Prepare Tauri resources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-core.ps1 -Target "${{ matrix.package_target }}" -Version "$env:MIHOMO_VERSION"
          powershell -ExecutionPolicy Bypass -File scripts/prepare-tauri-resources.ps1 -Target "${{ matrix.package_target }}"
          powershell -ExecutionPolicy Bypass -File scripts/verify-tauri-resources.ps1 -Target "${{ matrix.package_target }}"
      - name: Check Tauri Rust crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.rust_target }}"
      - name: Check Tauri web build
        run: pnpm --dir web build:tauri
      - name: Configure macOS code signing
        if: github.event_name == 'workflow_dispatch' && inputs.sign_desktop && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/configure-macos-signing.sh
      - name: Configure Windows code signing
        if: github.event_name == 'workflow_dispatch' && inputs.sign_desktop && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_CERTIFICATE_DIGEST_ALGORITHM: ${{ vars.WINDOWS_CERTIFICATE_DIGEST_ALGORITHM }}
          WINDOWS_CERTIFICATE_TIMESTAMP_URL: ${{ vars.WINDOWS_CERTIFICATE_TIMESTAMP_URL }}
        run: powershell -ExecutionPolicy Bypass -File scripts/configure-tauri-signing.ps1
      - name: Configure unsigned Windows bundle
        if: (github.event_name == 'push' || !inputs.sign_desktop) && runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/configure-tauri-signing.ps1
      - name: Build signed macOS bundles
        if: github.event_name == 'workflow_dispatch' && inputs.sign_desktop && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - name: Build signed Windows bundles
        if: github.event_name == 'workflow_dispatch' && inputs.sign_desktop && runner.os == 'Windows'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - name: Build unsigned desktop bundles
        if: github.event_name == 'push' || !inputs.sign_desktop
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rweb-clash-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.exe
      - name: Generate desktop checksums on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 > desktop-packages.txt
          if [ ! -s desktop-packages.txt ]; then
            echo "No desktop package files found." >&2
            exit 1
          fi
          while IFS= read -r -d '' package; do
            (cd "$(dirname "$package")" && shasum -a 256 "$(basename "$package")")
          done < desktop-packages.txt > rweb-clash-${{ matrix.name }}.sha256
      - name: Generate desktop checksums on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          $packages = Get-ChildItem -Path $bundleDir -Recurse -File -Include *.dmg, *.msi, *.exe
          if (-not $packages) { throw "No desktop package files found under $bundleDir." }
          $lines = @($packages | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            })
          [System.IO.File]::WriteAllText(
            "rweb-clash-${{ matrix.name }}.sha256",
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rweb-clash-${{ matrix.name }}-checksums
          if-no-files-found: error
          path: rweb-clash-${{ matrix.name }}.sha256

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - metadata
      - linux-binaries
      - docker
      - tauri
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Verify release artifacts
        shell: bash
        run: |
          require_one() {
            local pattern="$1"
            local label="$2"
            if ! find artifacts -type f -path "$pattern" | grep -q .; then
              echo "missing required artifact: $label ($pattern)" >&2
              find artifacts -type f | sort >&2
              exit 1
            fi
          }

          require_one 'artifacts/*/rweb-clash-linux-amd64.tar.gz' 'Linux amd64 archive'
          require_one 'artifacts/*/rweb-clash-linux-amd64.tar.gz.sha256' 'Linux amd64 checksum'
          require_one 'artifacts/*/rweb-clash-linux-amd64.bin' 'Linux amd64 standalone binary'
          require_one 'artifacts/*/rweb-clash-linux-amd64.bin.sha256' 'Linux amd64 standalone binary checksum'
          require_one 'artifacts/*/rweb-clash-linux-arm64.tar.gz' 'Linux arm64 archive'
          require_one 'artifacts/*/rweb-clash-linux-arm64.tar.gz.sha256' 'Linux arm64 checksum'
          require_one 'artifacts/*/rweb-clash-linux-arm64.bin' 'Linux arm64 standalone binary'
          require_one 'artifacts/*/rweb-clash-linux-arm64.bin.sha256' 'Linux arm64 standalone binary checksum'
          if ! find artifacts -type f -name '*.dmg' | grep -q .; then
            echo "missing required artifact: macOS arm64 DMG (*.dmg)" >&2
            find artifacts -type f | sort >&2
            exit 1
          fi
          if ! find artifacts -type f -name '*.msi' | grep -q .; then
            echo "missing required artifact: Windows amd64 MSI (*.msi)" >&2
            find artifacts -type f | sort >&2
            exit 1
          fi
          if ! find artifacts -type f -name '*.exe' | grep -q .; then
            echo "missing required artifact: Windows amd64 NSIS installer (*.exe)" >&2
            find artifacts -type f | sort >&2
            exit 1
          fi
          require_one 'artifacts/*/rweb-clash-macos-arm64.sha256' 'macOS checksum'
          require_one 'artifacts/*/rweb-clash-windows-amd64.sha256' 'Windows checksum'
      - name: Verify release checksums
        shell: bash
        run: |
          while IFS= read -r checksum; do
            while read -r expected file; do
              expected="${expected%$'\r'}"
              file="${file%$'\r'}"
              if [ -z "${expected:-}" ] || [ -z "${file:-}" ]; then
                echo "invalid checksum line in $checksum" >&2
                exit 1
              fi
              mapfile -t matches < <(find artifacts -type f -name "$file" | sort)
              if [ "${#matches[@]}" -ne 1 ]; then
                echo "expected exactly one artifact named $file for $checksum, found ${#matches[@]}" >&2
                printf '%s\n' "${matches[@]}" >&2
                exit 1
              fi
              actual="$(sha256sum "${matches[0]}" | awk '{ print $1 }')"
              if [ "$actual" != "$expected" ]; then
                echo "checksum mismatch for $file" >&2
                echo "expected: $expected" >&2
                echo "actual:   $actual" >&2
                exit 1
              fi
              echo "$file: OK"
            done < "$checksum"
          done < <(find artifacts -type f -name '*.sha256' | sort)
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: rweb-clash ${{ needs.metadata.outputs.release_tag }}
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.metadata.outputs.channel != 'stable' }}
          make_latest: ${{ needs.metadata.outputs.channel == 'stable' && 'true' || 'false' }}
          body: |
            ## rweb-clash

            Channel: `${{ needs.metadata.outputs.channel }}`
            Built at: `${{ needs.metadata.outputs.display_version }}`
            Package version: `${{ needs.metadata.outputs.package_version }}`

            ${{ needs.metadata.outputs.channel == 'snapshot' && '> Snapshot build generated automatically from master.' || needs.metadata.outputs.channel == 'beta' && '> Beta prerelease generated from a beta SemVer tag.' || '> Stable build generated from a semantic version tag or manual release dispatch.' }}
            ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop) && '> Desktop packages were built with the configured signing credentials.' || '> Desktop packages are unsigned; Windows SmartScreen and macOS Gatekeeper may warn.' }}

            Supported release targets:
            - macOS arm64: Tauri desktop package
            - Windows amd64: Tauri desktop package
            - Linux amd64: static backend + embedded web binary and systemd installer
            - Linux arm64: static backend + embedded web binary and systemd installer
            - Docker: `${{ needs.docker.outputs.image }}` for `linux/amd64` and `linux/arm64`

            Linux does not use Tauri. The Linux binary serves both the API and the web UI.
            For a reboot-safe host service independent of Docker, verify and extract the Linux `.tar.gz`, then run `./install-systemd.sh`.
            The standalone `.bin` assets are statically linked; verify the matching `.sha256` before use.
          files: |
            artifacts/**/*.bin
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
