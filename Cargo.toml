[workspace]
members = [
  "crates/app",
  "crates/shared_types",
  "crates/platform_linux",
  "crates/script_engine",
  "crates/controller_client",
  "crates/profile",
  "crates/core_manager",
  "crates/mihomo_manager",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = { version = "0.8.6", features = ["json", "macros"] }
boa_engine = "0.20.0"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
futures-util = "0.3.31"
flate2 = "1.1.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
rusqlite = { version = "0.37.0", features = ["bundled"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
which = "8.0.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
