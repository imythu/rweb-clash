[workspace]
members = [
  "crates/rweb-clash",
  "crates/rweb-clash-bin",
  "crates/rweb-clash-macos-helper",
  "crates/rweb-clash-windows-helper",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.103"
aes-gcm = "0.10.3"
axum = "0.8.9"
bytes = "1.11.0"
futures-util = "0.3.31"
getrandom = "0.2.16"
base64 = "0.22.1"
hex = "0.4.3"
ipnet = "2.11.0"
regex = "1.12.2"
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.51.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
uuid = { version = "1.19.0", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }
