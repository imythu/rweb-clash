openapi: 3.0.3
info:
  title: R-Clash API Specification
  description: Foundation API for the modern R-Clash client. Adheres to Action-oriented and Smart Merge principles.
  version: 1.5.0
servers:
  - url: /api
    description: Production API Server
security:
  - bearerAuth: []

paths:
  /configs:
    get:
      summary: 获取核心基础设施配置
      description: 获取包含 DNS、运行参数、外部控制及性能调优在内的全量底层配置。
      responses:
        '200':
          description: 返回当前核心状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
    patch:
      summary: 永久更新核心配置
      description: 应用并持久化配置更改至内核配置文件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
      responses:
        '200':
          description: 配置已成功同步至内核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'

  /tun/check:
    get:
      summary: 检查 TUN 开启条件
      description: 按当前操作系统检查 TUN 所需权限、设备及系统辅助工具是否可用。
      responses:
        '204':
          description: 当前环境具备开启 TUN 的条件
        '503':
          description: 当前环境不具备开启 TUN 的条件

  /proxies:
    get:
      summary: 获取代理拓扑结构
      description: 返回所有代理组（Groups）及其包含的节点（Nodes）详情。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProxyGroup'
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProxyNode'
  
  /proxies/{group}:
    put:
      summary: 切换代理组选中的出口
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "选中的节点名称" }
      responses:
        '200':
          description: 切换成功

  /manual-nodes:
    get:
      summary: 列出手动录入的节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManualNode'
    post:
      summary: 添加手动节点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualNodeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManualNode'

  /manual-nodes/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      summary: 更新手动节点
      description: 节点名称不可通过更新操作修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualNodeInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManualNode'
    delete:
      summary: 删除手动节点
      responses:
        '204':
          description: Deleted

  /subscriptions:
    get:
      summary: 列出所有资源提供者 (订阅)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
    post:
      summary: 添加新的资源提供者
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string }
                intervalSeconds: { type: integer }
                interval: { type: integer, description: "兼容旧前端，单位分钟" }
                inheritGlobal: { type: boolean }
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterRule'
      responses:
        '201':
          description: Created

  /subscriptions/{id}:
    patch:
      summary: 更新订阅元数据
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string }
                intervalSeconds: { type: integer }
                interval: { type: integer, description: "兼容旧前端，单位分钟" }
                inheritGlobal: { type: boolean }
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterRule'
      responses:
        '200':
          description: Updated
    delete:
      summary: 移除资源提供者
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted

  /subscriptions/{id}/members:
    get:
      summary: 查看订阅成员
      description: 返回订阅同步后保存的节点和订阅组，按过滤后与过滤前分组展示。过滤前订阅组当前不保存快照。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionMembers'

  /rules:
    get:
      summary: 获取当前路由逻辑表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
    post:
      summary: 部署新的路由规则
      description: 对应“快捷规则实验室”中的部署功能。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
      responses:
        '201':
          description: 规则已部署

  /rules/{id}:
    put:
      summary: 修改现有规则
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
    delete:
      summary: 移除规则
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted

  /rules/test:
    post:
      summary: 规则分流沙盒测试
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, description: "测试域名或IP" }
      responses:
        '200':
          description: 测试成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  hitRule: { $ref: '#/components/schemas/Rule' }
                  finalProxy: { type: string }

  /rule-sets:
    get:
      summary: 获取规则集清单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleSet'
    post:
      summary: 导入外部规则集
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSetInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSet'

  /dns/flush:
    post:
      summary: 立即清空解析缓存
      responses:
        '204':
          description: DNS Cache Flushed

  /logs:
    get:
      summary: 获取运行诊断日志流
      description: 用于“运行日志”页面的实时监控。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'

  /traffic:
    get:
      summary: 获取实时流量吞吐
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  up: { type: integer, description: "上传速度 (Bps)" }
                  down: { type: integer, description: "下载速度 (Bps)" }

  /connections:
    get:
      summary: 获取活跃网络连接概览
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'

  /nodes/test:
    post:
      summary: 对特定节点执行延迟测试
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  delay: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 使用 RWEB_CLASH_API_TOKEN；非回环监听时必须配置，本地回环且未配置令牌时可省略。
  schemas:
    SystemConfig:
      type: object
      properties:
        allow_lan: { type: boolean, description: "允许局域网连接" }
        ipv6: { type: boolean, description: "IPv6 支持" }
        log_level: { type: string, enum: [info, warning, error, debug, silent] }
        mixed_port: { type: integer, example: 7890 }
        external_controller: { type: string, example: "127.0.0.1:9090" }
        external_controller_enabled: { type: boolean }
        secret: { type: string, description: "Mihomo external-controller 访问密钥（不是本 HTTP API 的 Bearer 令牌）" }
        dns_enabled: { type: boolean }
        dns_mode: { type: string, enum: [fake-ip, redir-host] }
        store_selected: { type: boolean, description: "持久化节点选择" }
        unified_delay: { type: boolean, description: "统一体感延迟" }
        tcp_concurrent: { type: boolean, description: "TCP 并发增强" }
        tun: { type: boolean, description: "启用 TUN 模式" }
        system_proxy: { type: boolean, description: "启用系统代理" }
        mode: { type: string, enum: [rule, global, direct] }
        auto_start: { type: boolean, description: "开机自动启动" }

    ProxyGroup:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        source: { type: string, enum: [system, subscription, custom] }
        subscriptionName: { type: string, nullable: true, description: "订阅托管分组的显示名称；内部运行时 ID 不包含该名称" }
        builtin: { type: boolean, description: "系统内置分组不可增删改" }
        now: { type: string, description: "当前选中的节点名称" }
        delay: { type: integer }
        all:
          type: array
          items: { type: string }
        filter:
          type: array
          items:
            $ref: '#/components/schemas/GroupFilter'

    GroupFilter:
      type: object
      properties:
        id: { type: string }
        action: { type: string, enum: [keep, discard] }
        type: { type: string, enum: [name, country, protocol, latency, status, subscription] }
        operator: { type: string, enum: [contains, equals, in, regex, is, less_than, starts_with] }
        value: { type: string, description: "单值匹配参数；in 规则使用 values" }
        values:
          type: array
          description: "多值匹配参数，operator 为 in 时使用"
          items: { type: string }
        enabled: { type: boolean }

    ProxyNode:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        latency: { type: integer }
        country: { type: string, example: "HK" }
        subscriptionId: { type: string, nullable: true }
        subscriptionName: { type: string, nullable: true, description: "订阅显示名称；内部运行时 ID 不包含该名称" }

    ManualNodeInput:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        config:
          type: object
          description: Mihomo proxies 数组中的单个节点对象；name 由顶层字段注入。
          required: [type]
          properties:
            type:
              type: string
              enum:
                - ss
                - ssr
                - vmess
                - vless
                - trojan
                - http
                - socks5
                - snell
                - ssh
                - hysteria
                - hysteria2
                - tuic
                - wireguard
                - masque
                - openvpn
                - shadowquic
                - mieru
                - anytls
                - sudoku
                - trusttunnel
                - tailscale
                - direct
                - dns
                - rematch
            server: { type: string, description: "需要远端地址的协议必填；WireGuard 使用 peers 完整写法时可省略" }
            port: { type: integer, minimum: 1, maximum: 65535, description: "需要远端端口的协议必填；Mieru 可改用 port-range，WireGuard 使用 peers 完整写法时可省略" }
            peers:
              type: array
              description: "WireGuard 多 peer 完整写法；配置后忽略顶层 peer 端点和公钥字段"
              items:
                type: object
                required: [server, port, public-key]
                properties:
                  server: { type: string }
                  port: { type: integer, minimum: 1, maximum: 65535 }
                  public-key: { type: string }
                  allowed-ips:
                    type: array
                    items: { type: string }
          additionalProperties: true

    ManualNode:
      allOf:
        - $ref: '#/components/schemas/ManualNodeInput'
        - type: object
          required: [displayName, type, latency]
          properties:
            displayName: { type: string }
            type: { type: string }
            latency: { type: integer, description: "毫秒；-1 表示未测速，0 表示超时" }

    Subscription:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        format: { type: string, description: "订阅源解析格式：clash、base64-clash、legacy、base64-legacy 或 unknown" }
        nodes: { type: integer }
        status: { type: string, enum: [online, offline, updating] }
        expiry: { type: string, nullable: true }
        intervalSeconds: { type: integer }
        interval: { type: integer }
        inheritGlobal: { type: boolean }
        lastUpdate: { type: string }
        lastError: { type: string, nullable: true }
        traffic:
          type: object
          properties:
            used: { type: integer }
            total: { type: integer }
        breakdown:
          type: object
          additionalProperties: { type: integer }
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FilterRule'

    FilterRule:
      type: object
      properties:
        id: { type: string }
        action: { type: string, enum: [keep, discard] }
        type: { type: string, enum: [contains, not_contains, regex, in] }
        pattern: { type: string, description: "单值匹配参数；in 规则使用 values" }
        values:
          type: array
          description: "精确匹配的名字方案列表，type 为 in 时使用"
          items: { type: string }
        enabled: { type: boolean }

    SubscriptionMembers:
      type: object
      properties:
        subscriptionId: { type: string }
        subscriptionName: { type: string }
        filtered:
          $ref: '#/components/schemas/SubscriptionMemberSection'
        beforeFilter:
          $ref: '#/components/schemas/SubscriptionMemberSection'

    SubscriptionMemberSection:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionMemberNode'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionMemberGroup'

    SubscriptionMemberNode:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        protocol: { type: string }
        country: { type: string }
        latency: { type: integer }
        filteredOut: { type: boolean }
        filterReason: { type: string }

    SubscriptionMemberGroup:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        type: { type: string }
        members:
          type: array
          items: { type: string }
        memberCount: { type: integer }
        filteredOut: { type: boolean }
        filterReason: { type: string }

    Rule:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [DOMAIN-SUFFIX, DOMAIN, DOMAIN-KEYWORD, IP-CIDR, GEOIP, MATCH] }
        value: { type: string }
        policy: { type: string, description: "目标代理组或预设策略" }
        desc: { type: string }

    RuleSetInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        intervalSeconds: { type: integer, example: 86400 }
        format:
          type: string
          enum: [text, yaml]
          default: text

    RuleSet:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        behavior:
          type: string
          nullable: true
          enum: [domain, ipcidr, classical]
        format: { type: string }
        ruleCount: { type: integer }
        lastUpdate: { type: string, nullable: true }
        lastError: { type: string, nullable: true }

    LogEntry:
      type: object
      properties:
        time: { type: string, format: "date-time" }
        level: { type: string, enum: [info, warning, error, debug] }
        payload: { type: string, description: "原始日志内容" }

    Connection:
      type: object
      properties:
        id: { type: string }
        domain: { type: string }
        rule: { type: string }
        policy: { type: string }
        speed: { type: string }
